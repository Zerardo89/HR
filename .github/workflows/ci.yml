# Integrazione continua (WP-003). Ogni PR deve essere verde prima del merge su main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, tipi, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Nessuna modifica allo schema DB senza migrazione
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name=ci_drift
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "Lo schema è cambiato senza migrazione: esegui 'pnpm db:generate' e committa il file."
            exit 1
          fi
      - run: pnpm build
      - name: Dipendenze vulnerabili (livello alto o superiore)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Test di integrazione (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr_ci_only
          POSTGRES_DB: hr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hr -d hr"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://hr:hr_ci_only@localhost:5432/hr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Migrazioni applicate due volte (devono essere idempotenti)"
        run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm test:integration

  security:
    name: Segreti e analisi statica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (segreti nel codice e nella storia)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (OWASP Top 10, TypeScript)
        run: |
          pipx run semgrep scan --error --metrics=off \
            --config p/owasp-top-ten --config p/typescript --config p/secrets \
            --exclude node_modules --exclude db/migrations
