# Integrazione continua (WP-003). Ogni PR deve essere verde prima del merge su main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Le Actions sono fissate all'hash del commit (non al tag) contro gli attacchi alla catena di fornitura;
# Dependabot propone gli aggiornamenti (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, tipi, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DB e posta di prova per gli e2e di accesso (WP-008): il codice si legge da Mailpit.
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr_ci_only
          POSTGRES_DB: hr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hr -d hr"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://hr:hr_ci_only@localhost:5432/hr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Nessuna modifica allo schema DB senza migrazione
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name=ci_drift
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "Lo schema è cambiato senza migrazione: esegui 'pnpm db:generate' e committa il file."
            exit 1
          fi
      - run: pnpm build
      - name: Dipendenze vulnerabili (livello alto o superiore)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm taxonomy:import
      # Ruoli ristretti (WP-027): il sito gira come hr_app, i job come hr_worker; i test preparano i dati come
      # proprietario. Password solo per la CI, come quella del proprietario qui sopra.
      - run: pnpm db:roles
        env:
          DB_APP_PASSWORD: hr_app_ci_only
          DB_WORKER_PASSWORD: hr_worker_ci_only
      - run: pnpm test:e2e
        env:
          E2E_APP_DATABASE_URL: postgres://hr_app:hr_app_ci_only@localhost:5432/hr
          E2E_WORKER_DATABASE_URL: postgres://hr_worker:hr_worker_ci_only@localhost:5432/hr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Test di integrazione (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr_ci_only
          POSTGRES_DB: hr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hr -d hr"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://hr:hr_ci_only@localhost:5432/hr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Migrazioni applicate due volte (devono essere idempotenti)"
        run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm test:integration

  # Immagini e compose del server di casa (WP-010c): si costruiscono e partono come in produzione, senza tunnel.
  docker:
    name: Immagini di produzione e prova di avvio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Immagini (sito, strumenti, database)
        run: |
          docker build --target app --build-arg APP_VERSION="${GITHUB_SHA::7}" -t hr-app .
          docker build --target tools -t hr-tools .
          docker build -t hr-postgres:17 docker/postgres
      - name: Segreti e configurazione di prova (mai usati altrove)
        run: |
          cp .env.production.example .env.production
          sed -i 's|^PREVIEW_INVITE_CODES=.*|PREVIEW_INVITE_CODES=PROVA-CI-2026|' .env.production
          mkdir -p secrets
          docker run --rm --user root -v "$PWD/secrets:/app/secrets" --entrypoint node_modules/.bin/tsx hr-tools scripts/generate-server-secrets.ts
          docker run --rm --user root -v "$PWD/secrets:/app/secrets" --entrypoint node_modules/.bin/tsx hr-tools scripts/generate-keys.ts
          for f in cloudflared_token smtp_password r2_access_key_id r2_secret_access_key; do echo prova | sudo tee "secrets/$f" > /dev/null; done
          sudo chmod 444 secrets/*
      - name: Avvio di database, migrazioni, ruoli, sito e worker
        run: |
          docker compose -f docker-compose.prod.yml up -d --no-build app worker
          for i in $(seq 1 36); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hr-app-1)" = healthy ] && break
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps -a
          test "$(docker inspect -f '{{.State.Health.Status}}' hr-app-1)" = healthy
          test "$(docker inspect -f '{{.State.ExitCode}}' hr-migrate-1)" = 0
          test "$(docker inspect -f '{{.State.Running}}' hr-worker-1)" = true
      # Su Linux i file montati non sono eseguibili: il servizio di backup deve partire lo stesso.
      - name: Servizi a richiesta (tools, backup) partono
        run: |
          docker compose -f docker-compose.prod.yml --profile ops run --rm tools node_modules/.bin/tsx --version
          docker compose -f docker-compose.prod.yml --profile ops run --rm backup bash /backup-registro.sh
          docker compose -f docker-compose.prod.yml --profile ops run --rm backup pg_dump --version
      - name: Log in caso di errore
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 80
      - if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  security:
    name: Segreti e analisi statica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks (segreti nel codice e nella storia)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (OWASP Top 10, TypeScript)
        run: |
          pipx run semgrep scan --error --metrics=off \
            --config p/owasp-top-ten --config p/typescript --config p/secrets \
            --exclude node_modules --exclude db/migrations
